<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booker's Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing {
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            margin: 0;
            font-size: 40px;
        }

        p {
            margin: 12px auto 40px;
            max-width: 480px;
            font-size: 15px;
            line-height: 1.6;
        }

        .choices {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .choices a {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 220px;
            padding: 30px 20px;
            background: #d3cda2;
            color: black;
            text-decoration: none;
        }

        .choices a:hover {
            background: #c1b252;
            color: #fff;
        }

        @media (max-width: 600px) {
            h1 { font-size: 28px; }
            .choices a { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="landing">
        <h1>Booker's Club</h1>
        <p>A library management system for browsing, tracking, and managing the collection. Choose how you'd like to continue.</p>

        <div class="choices">
            <a href="user.html">
                <i class="bi bi-person"></i>
                <span>Enter as User</span>
                <small>Browse the collection</small>
            </a>
            <a href="admin.html">
                <i class="bi bi-gear-wide-connected"></i>
                <span>Enter as Admin</span>
                <small>Manage inventory</small>
            </a>
        </div>
    </div>

</body>
</html>
